<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC — Induction Live CSS Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #060911;
            --bg-card: rgba(13, 19, 33, 0.9);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-indigo: #6366f1;
            --radius-lg: 20px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.18), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.12), transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        .controller-box {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .controller-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #10b981, #ef4444);
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-indigo);
            background: rgba(99, 102, 241, 0.12);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Hero Switch Unit */
        .switch-unit {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 20px;
            margin-bottom: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .switch-unit.online {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
        }

        .switch-unit.offline {
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.3);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 24px;
        }

        .status-badge.online {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* Power Button */
        .power-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 42px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            color: white;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .power-button:hover {
            transform: scale(1.08);
        }

        .power-button:active {
            transform: scale(0.95);
        }

        .power-button.btn-online {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 0 45px rgba(16, 185, 129, 0.5);
        }

        .power-button.btn-offline {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.6);
        }

        .btn-subtext {
            font-size: 11px;
            letter-spacing: 1.5px;
            font-family: 'DM Mono', monospace;
            text-transform: uppercase;
        }

        .key-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 18px;
            font-family: 'DM Mono', monospace;
        }

        .key-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        /* Action Links */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-card:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
        }

        /* Config Accordion */
        .db-config {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: left;
        }

        .db-config summary {
            font-size: 12px;
            font-family: 'DM Mono', monospace;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .db-config-content {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .db-config input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            outline: none;
        }

        .db-config button {
            background: var(--accent-indigo);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controller-box">
            <div class="header-tag"><i class="fa-solid fa-bolt"></i> Live Induction Tool</div>
            <h1>EPIC CSS Controller</h1>
            <p class="subtitle">Remote killswitch for live induction & presentation demonstrations</p>

            <div class="switch-unit online" id="switchUnit">
                <div class="status-badge online" id="statusBadge">
                    <span class="pulse-dot"></span>
                    <span id="statusText">STYLESHEETS ACTIVE (ONLINE)</span>
                </div>

                <div>
                    <button class="power-button btn-online" id="powerBtn" title="Click or press Spacebar to toggle">
                        <i class="fa-solid fa-power-off"></i>
                        <span class="btn-subtext" id="btnSubtext">ACTIVE</span>
                    </button>
                </div>

                <div class="key-hint">Press <kbd>Space</kbd> or click to toggle CSS state</div>
            </div>

            <div class="actions-grid">
                <a href="induction.html" target="_blank" class="action-card">
                    <i class="fa-solid fa-chalkboard-user"></i> Open Induction Slide
                </a>
                <a href="index.html" target="_blank" class="action-card">
                    <i class="fa-solid fa-globe"></i> Open Main Website
                </a>
            </div>

            <details class="db-config">
                <summary><i class="fa-solid fa-gear"></i> Database URL Setting</summary>
                <div class="db-config-content">
                    <input type="url" id="dbUrlInput" placeholder="https://your-project-id-default-rtdb.firebaseio.com">
                    <button id="btnSaveDb">Save</button>
                </div>
            </details>
        </div>
    </div>

    <script src="assets/js/firebase-config.js"></script>
    <script>
        const DEFAULT_URL = window.FIREBASE_DB_URL || "https://epic-3b86d-default-rtdb.asia-southeast1.firebasedatabase.app";
        let dbUrl = localStorage.getItem('epic_firebase_db_url') || DEFAULT_URL;

        const switchUnit = document.getElementById('switchUnit');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const powerBtn = document.getElementById('powerBtn');
        const btnSubtext = document.getElementById('btnSubtext');
        const dbUrlInput = document.getElementById('dbUrlInput');
        const btnSaveDb = document.getElementById('btnSaveDb');

        let isCssDisabled = false;
        let eventSource = null;

        dbUrlInput.value = dbUrl;

        function updateUI(disabled) {
            isCssDisabled = Boolean(disabled);
            if (isCssDisabled) {
                switchUnit.className = 'switch-unit offline';
                statusBadge.className = 'status-badge offline';
                statusText.textContent = 'CSS UNLINKED (RAW HTML)';
                powerBtn.className = 'power-button btn-offline';
                btnSubtext.textContent = 'UNLINKED';
            } else {
                switchUnit.className = 'switch-unit online';
                statusBadge.className = 'status-badge online';
                statusText.textContent = 'STYLESHEETS ACTIVE (ONLINE)';
                powerBtn.className = 'power-button btn-online';
                btnSubtext.textContent = 'ACTIVE';
            }
        }

        function connect() {
            if (eventSource) eventSource.close();
            const cleanUrl = dbUrl.replace(/\/+$/, '');
            const streamUrl = `${cleanUrl}/killswitch/cssDisabled.json`;

            fetch(streamUrl)
                .then(r => r.json())
                .then(val => updateUI(val === true))
                .catch(() => {});

            try {
                eventSource = new EventSource(streamUrl);
                eventSource.addEventListener('put', e => {
                    try {
                        const parsed = JSON.parse(e.data);
                        updateUI(parsed.data === true);
                    } catch (err) {}
                });
                eventSource.addEventListener('patch', e => {
                    try {
                        const parsed = JSON.parse(e.data);
                        updateUI(parsed.data === true);
                    } catch (err) {}
                });
            } catch (err) {}
        }

        async function toggle() {
            const newState = !isCssDisabled;
            powerBtn.style.opacity = '0.6';
            powerBtn.disabled = true;

            const cleanUrl = dbUrl.replace(/\/+$/, '');
            try {
                const res = await fetch(`${cleanUrl}/killswitch/cssDisabled.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newState)
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                updateUI(newState);
            } catch (err) {
                alert("Firebase Update Failed: " + err.message + "\nCheck database rules or URL.");
            } finally {
                powerBtn.style.opacity = '1';
                powerBtn.disabled = false;
            }
        }

        powerBtn.addEventListener('click', toggle);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                toggle();
            }
        });

        btnSaveDb.addEventListener('click', () => {
            const val = dbUrlInput.value.trim();
            if (val) {
                dbUrl = val;
                localStorage.setItem('epic_firebase_db_url', dbUrl);
                connect();
                alert("Database URL saved!");
            }
        });

        connect();
    </script>
</body>
</html>
